<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="View your Ingera Diary profile — your personal space to showcase posts, manage followers, and reflect your digital presence."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>
    <link rel="stylesheet" href="../src/css/style.css" />
  </head>
  <body cl>
    <header>
      <div id="nav"></div>
    </header>
    <main class="px-4 py-8 max-w-4xl mx-auto">
      <h1 class="text-3xl font-bold text-center text-sky-800 mb-8">Profile</h1>

    <div class="bg-gray-50 px-4 py-8 max-w-5xl mx-auto">
 
  <!-- Banner -->
  <div class="relative w-full h-1/2 rounded-t-lg overflow-hidden">
    <img
      id="profile-banner"
      src="https://wudasi6951.live-website.com/wp-content/uploads/2025/03/sketchperfect-7.jpg"
      alt="Banner"
      class="w-full  object-cover"
    />
  </div>

    <!-- Avatar overlapping banner -->
    <div class="left-6">
      <img
        id="profile-avatar"
        src="https://wudasi6951.live-website.com/wp-content/uploads/2025/03/sketchperfect-2.jpg"
        alt="Avatar"
        class="w-24 h-24 rounded-full border-4 border-white shadow-md object-cover"
      />
    <!-- Profile Info below avatar -->
  
    <h2 id="profile-username" class="text-2xl font-bold text-gray-800">@username</h2>
     </div>
     <div class="mt-2 ml-6">
    <p id="profile-bio" class="text-gray-600 text-sm">This is your bio</p>
  </div>
</div>

  <!-- Followers / Following / Edit -->
 
<div class="flex px-3 gap-y-40 justify-start mt-6 text-sm">
  
  <!-- Following -->
  <div class="flex items-center font-semibold gap-x-2 px-4 text-blue-700 hover:text-sky-900">
    <h4 class="font-semibold ">Following</h4>
    <span class="bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700 rounded">204</span>
  </div>

  <!-- Followers -->
  <div class="flex items-center font-semibold gap-x-2 px-4 text-blue-700 hover:text-sky-900">
    <h4>Followers</h4>
    <span class="bg-slate-100 px-3 py-1 text-xs  rounded">194</span>
  </div>

  <!-- Search -->
  <input
    class="placeholder:text-gray-400 placeholder:italic border px-4 py-1 rounded-md"
    placeholder="Search"
    type="text"
    name="search"
  />

    <button
      id="editProfileBtn"
      class="btn-secondary rounded-lg px-4"
    >
      Edit Profile
    </button>
  </div>

  <!-- Edit Form -->
  <form id="updateProfileForm" class="space-y-4 mt-6 hidden">
   
    <input
      type="text"
      id="bio"
      name="bio"
      placeholder="Bio"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
    />

    <input
      type="url"
      id="avatar-url"
      name="avatar-url"
      placeholder="Avatar URL"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
    />

    <input
      type="text"
      id="avatar-alt"
      name="avatar-alt"
      placeholder="Avatar ALT text"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
    />

    <input
      type="url"
      id="banner-url"
      name="banner-url"
      placeholder="Banner URL"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
    />

    <input
      type="text"
      id="banner-alt"
      name="banner-alt"
      placeholder="Banner ALT text"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
    />

    <button class=" btn-primary">
      Save changes
    </button>
  </form>
</div>

<!--put post here-->


    <script src="../src/js/script.js" type="module"></script>
  </body>
</html>
