<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="View your Ingera Diary profile — your personal space to showcase posts, manage followers, and reflect your digital presence."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>
    <link rel="stylesheet" href="../src/css/style.css" />
  </head>
  <body>
    <header>
      <div id="nav"></div>
    </header>
    <main class="px-4 py-8 max-w-4xl mx-auto">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Profile</h1>

      <div
        id="profileContainer"
        class="bg-gray-25 p-6 rounded-xl shadow-md space-y-6"
      >
        <div
          id="bannerContainer"
          class="h-40 bg-gray-100 rounded-lg overflow-hidden"
        ></div>

        <div
          id="avatarContainer"
          class="w-24 h-24 rounded-full overflow-hidden border-4 border-yellow-700 mt-12 mx-auto"
        >
          <!-- Avatar Image inserted via JS -->
        </div>

        <h2
          id="username"
          class="text-2xl text-center font-semibold text-gray-700"
        ></h2>
        <p id="profileBio" class="text-center text-black-200 text-sm"></p>

        <div class="bg-gray-50 p-4 rounded-lg space-y-6">
               

            <button
              id="editProfileBtn"
              class=" btn btn-secondary w-1/4  place-items-end"
            >
              Edit Profile
            </button>
       
          <form id="updateProfileForm" class="space-y-4">
            <a
              href="/profile/index.html"
              class="text-sm text-indigo-500 hover:underline"
              >← Back</a
            >

            <input
              type="text"
              id="bio"
              name="bio"
              placeholder="Bio"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
            />
            <input
              type="url"
              id="avatar-url"
              name="avatar-url"
              placeholder="Avatar URL"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
            />
            <input
              type="text"
              id="avatar-alt"
              name="avatar-alt"
              placeholder="Avatar ALT text"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
            />
            <input
              type="url"
              id="banner-url"
              name="banner-url"
              placeholder="Banner URL"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
            />
            <input
              type="text"
              id="banner-alt"
              name="banner-alt"
              placeholder="Banner ALT text"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
            />

            <button
              type="submit"
              class="btn btn-primary w-2/4 flex justify-center"
            >
              Update Profile
            </button>
          </form>

 
    </main>
  </body>
</html>
