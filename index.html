<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Discover posts, people, and tags across Ingera Diary. Search to explore meaningful content shared by the community."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media App</title>
    <link rel="stylesheet" href="./src/css/style.css" />
  </head>
  <body class="min-h-screen bg-slate-50 font-sans">
    <!-- Header -->
    <header class="bg-slate-800 p-4 sticky top-0 z-50">
      <!-- Mobile Menu Button -->
      <button
        id="mobileMenuToggle"
        class="text-white text-2xl md:hidden"
        aria-label="Toggle menu"
      >
        <!-- Hamburger SVG Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="42px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="white"
        >
          <path
            d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
          />
        </svg>
      </button>

      <!-- Nav Bar -->
      <nav
        class="relative flex justify-center items-center text-white text-xl font-semibold py-4"
      >
        <!-- Center Nav (desktop) -->
        <div
          id="nav-center"
          class="absolute left-1/2 transform -translate-x-1/2 space-x-6 hidden md:flex"
        >
          <a href="/index.html" class="hover:underline">Home</a>
          <a href="/index.html" class="hover:underline">Explore</a>
        </div>

        <!-- Right Nav -->
        <div id="nav-right" class="hidden md:flex items-center gap-2 ml-auto">
          <form id="navSearchForm" class="hidden md:block">
            <input
              id="navSearchInput"
              class="placeholder:text-gray-200 placeholder:italic border rounded-md text-black"
              placeholder="Search"
              type="text"
              name="search"
            />
          </form>
          <a href="/profile/index.html" class="hover:underline">Profile</a>
          <a href="/auth/login/index.html" class="hover:underline">Logout</a>
        </div>
      </nav>

      <!-- Heading -->
      <h1 class="text-3xl font-bold text-white mt-4">New Post Feed</h1>
    </header>

    <!-- Mobile Side Menu Panel -->
    <div
      id="mobileMenu"
      class="fixed top-0 left-0 h-full w-64 bg-white text-black shadow-lg transform -translate-x-full transition-transform duration-300 ease-in-out z-50 md:hidden p-6 space-y-4"
    >
      <a href="/index.html" class="block font-medium hover:underline">Home</a>
      <a href="/index.html" class="block font-medium hover:underline"
        >Explore</a
      >
      <form id="navSearchForm" class="hidden md:block">
        <input
          id="navSearchInput"
          class="placeholder:text-gray-200 placeholder:italic border rounded-md text-black"
          placeholder="Search"
          type="text"
          name="search"
        />
      </form>
      <a href="/profile/index.html" class="block font-medium hover:underline"
        >Profile</a
      >
      <a href="/auth/login/index.html" class="block font-medium hover:underline"
        >Logout</a
      >
    </div>

    <!-- Overlay for closing menu -->
    <div
      id="mobileOverlay"
      class="fixed inset-0 bg-black bg-opacity-30 hidden z-40 md:hidden"
    ></div>

    <main class="flex flex-row justify-between px-10 mt-0">
      <section
        class="flex flex-col items-center justify-center w-full max-w-2xl mx-auto bg-white p-6 rounded shadow-md my-10"
      >
        <div id="postCreate" class="flex flex-col">
          <!-- ✅ Form Input Section -->
          <form class="flex flex-col gap-3">
            <label for="comment" class="text-xl text-gray-700 font-medium"
              >Post What is in your mind</label
            >
            <input
              type="text"
              id="bio"
              name="bio"
              placeholder="Title"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400"
            />
            <label for="upload-image" class="text-sm text-gray-700 font-medium"
              >Upload an image</label
            >
            <input
              type="file"
              id="upload-image"
              name="upload-image"
              accept="image/*"
              class="file:mr-4 file:py-2 file:px-4 file:border-0 file:rounded file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer"
            />
            <textarea
              id="comment"
              name="comment"
              rows="3"
              placeholder="Write your thoughts..."
              class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
            ></textarea>
            <button
              type="submit"
              class="self-end bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition"
            >
              Post
            </button>
          </form>
        </div>
        <!--post  appear here-->
        <div
          id="post-box"
          class="flex flex-col h-auto w-full max-w-2xl mx-auto bg-white p-6 rounded mb-6"
        >
          <h4 id="post-title" class="text-xl font-semibold text-gray-800 mb-4">
            title
          </h4>

          <div class="rounded-lg overflow-hidden mb-4">
            <img
              id="post-image"
              src="https://wudasi6951.live-website.com/wp-content/uploads/2025/03/sketchperfect-7.jpg"
              alt="Post image"
              class="w-full object-cover border border-gray-300"
            />
          </div>

          <div>
            <p
              id="post-descriptionn"
              class="text-justify text-gray-600 text-sm"
            ></p>
          </div>
          <div
            class="reaction-buttons flex gap-2 bg-gray-50 w-full h-auto p-2 mt-0 rounded-sm"
            id="reactionButtons"
          >
            <button data-emoji="thumbsUp" class="emoji-btn">👍</button>
            <button data-emoji="thumbsDown" class="emoji-btn">👎</button>
            <button data-emoji="heart" class="emoji-btn">❤️</button>
            <button data-emoji="laugh" class="emoji-btn">😂</button>
          </div>

          <div>
            <h2>Comments</h2>
            <div id="commentsContainer"></div>
            <form
              id="commentForm"
              class="flex gap-2 bg-gray-50 w-full h-auto p-2 mt-0 rounded-sm"
            >
              <input
                type="text"
                placeholder="Add comment"
                class="border px-2 py-1 rounded w-full mb-2"
              />
              <button
                type="submit"
                class="bg-gray-400 text-white px-2 py-1 rounded"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  height="24px"
                  viewBox="0 -960 960 960"
                  width="24px"
                  fill="#1f1f1f"
                >
                  <path
                    d="m321-80-71-71 329-329-329-329 71-71 400 400L321-80Z"
                  />
                </svg>
              </button>
            </form>
          </div>
        </div>
      </section>

      <!-- Following and Follower section -->
      <section
        class="flex flex-col max-w-sm w-60 ml-auto mt-0 bg-gray-50 p-2 rounded shadow-md"
      >
        <!-- Toggle Button (three dots) -->
        <div class="md:hidden top-2 right-6 z-10">
          <button id="sidebarToggleBtn" class="text-gray-700 text-3xl">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#1f1f1f"
            >
              <path
                d="M480-160q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm0-240q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-240q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Z"
              />
            </svg>
          </button>
        </div>

        <!-- Sidebar Panel (Initially Hidden) -->
        <div
          id="sidebarPanel"
          class="fixed top-40 right-0 h-full w-64 bg-white transform translate-x-full transition-transform duration-300 ease-in-out md:translate-x-0 md:static md:w-60 md:h-auto md:bg-gray-50 p-4 rounded md:shadow-none z-40"
        >
          <!-- Following Section -->
          <div
            class="flex flex-col items-start font-semibold gap-y-1 text-blue-700 mb-6"
          >
            <h2 class="text-xl">Following</h2>
            <div class="flex items-center gap-x-2 py-2">
              <img
                src="https://wudasi6951.live-website.com/wp-content/uploads/2025/03/sketchperfect-2.jpg"
                alt="Avatar"
                class="w-12 h-12 rounded-full border-4 border-white shadow-md object-cover"
              />
              <h4 class="text-md font-semibold text-gray-600">@username</h4>
            </div>
          </div>

          <!-- Follower Section -->
          <div
            class="flex flex-col items-start font-semibold gap-y-1 text-blue-700"
          >
            <h2 class="text-xl">Follower</h2>
            <div class="flex items-center gap-x-2 py-2">
              <img
                src="https://wudasi6951.live-website.com/wp-content/uploads/2025/03/sketchperfect-2.jpg"
                alt="Avatar"
                class="w-12 h-12 rounded-full border-4 border-white shadow-md object-cover"
              />
              <h4 class="text-md font-semibold text-gray-600">@username</h4>
            </div>
          </div>
        </div>

        <!-- Overlay for click outside -->
        <div
          id="sidebarOverlay"
          class="fixed inset-0 bg-black bg-opacity-30 hidden z-30 md:hidden"
        ></div>
      </section>
    </main>

    <!--footer section-->
    <footer class="bg-slate-900 w-full p-10">
      <div id="nav"></div>
      <p class="text-md font-bold text-center text-white">
        @copyright Azeb 2025
      </p>
    </footer>

    <script type="module" src="./src/js/script.js"></script>
  </body>
</html>
