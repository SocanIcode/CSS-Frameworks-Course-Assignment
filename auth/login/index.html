<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Log in to your Ingera Diary account to access your diary feed, connect with friends, and continue your personal journey."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../../src/css/style.css" />
  </head>
  <body class="min-h-screen bg-slate-50 font-sans">
    <header class="bg-slate-800 p-4 sticky top-0 z-50">
      <!-- Mobile Menu Button -->
      <button
        id="mobileMenuToggle"
        class="text-white text-2xl md:hidden"
        aria-label="Toggle menu"
      >
        <!-- Hamburger SVG Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="42px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="white"
        >
          <path
            d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
          />
        </svg>
      </button>

      <!-- Nav Bar -->
      <nav
        class="relative flex justify-center items-center text-white text-xl font-semibold py-4"
      >
        <!-- Center Nav (desktop) -->
        <div
          id="nav-center"
          class="absolute left-1/2 transform -translate-x-1/2 space-x-6 hidden md:flex"
        >
          <a href="/index.html" class="hover:underline">Home</a>
          <a href="/index.html" class="hover:underline">Explore</a>
        </div>

        <!-- Right Nav -->
        <div id="nav-right" class="hidden md:flex items-center gap-2 ml-auto">
          <form id="desktopSearchForm" class="hidden md:block">
            <input
              id="desktopSearchInput"
              class="placeholder:text-gray-200 mr-6 ..."
              placeholder="Search"
              type="text"
              name="search"
            />
          </form>
          <a href="/profile/index.html" class="hover:underline">Profile</a>
          <a href="/auth/login/index.html" class="hover:underline">Logout</a>
        </div>
      </nav>

      <!-- Heading -->
      <h1 class="text-3xl font-bold text-white mt-4">CSS FrameWorks</h1>
    </header>

    <!-- Mobile Side Menu Panel -->
    <div
      id="mobileMenu"
      class="fixed top-0 left-0 h-full w-64 bg-white text-black shadow-lg transform -translate-x-full transition-transform duration-300 ease-in-out z-50 md:hidden p-6 space-y-4"
    >
      <a href="/index.html" class="block font-medium hover:underline">Home</a>
      <a href="/index.html" class="block font-medium hover:underline"
        >Explore</a
      >
      <form id="mobileSearchForm" class="hidden md:hidden">
        <input
          id="mobileSearchInput"
          class="placeholder:text-gray-200 placeholder:italic border rounded-md text-black"
          placeholder="Search"
          type="text"
          name="search"
        />
      </form>
      <a href="/profile/index.html" class="block font-medium hover:underline"
        >Profile</a
      >
      <a href="/auth/login/index.html" class="block font-medium hover:underline"
        >Logout</a
      >
    </div>

    <!-- Overlay for closing menu -->
    <div
      id="mobileOverlay"
      class="fixed inset-0 bg-black bg-opacity-30 hidden z-40 md:hidden"
    ></div>

    <main>
      <div class="flex items-center justify-center min-h-screen pt-16">
        <div
          class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg border-2 border-gray-200"
        >
          <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            Login
          </h1>
          <form id="loginForm" class="space-y-5">
            <div>
              <label
                for="email"
                class="block text-sm font-medium text-gray-700"
              >
                Email <span class="text-red-500">*</span>
              </label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                required
                autocomplete="email"
                class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>

            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-700"
              >
                Password <span class="text-red-500">*</span>
              </label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
                autocomplete="new-password"
                minlength="8"
                class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>

            <button type="submit" class="btn btn-primary">Login</button>

            <div class="text-center mt-4">
              <a
                href="/auth/register/"
                class="text-indigo-500 hover:underline text-sm"
              >
                Don't have an account? Register
              </a>
            </div>
          </form>
        </div>
      </div>
    </main>
    <footer class="bg-slate-900 w-full p-10">
      <div id="nav"></div>
      <p class="text-md font-bold text-center text-white">
        @copyright Azeb 2025
      </p>
    </footer>
    <script type="module">
      import { handleLoginForm } from "/src/js/ui/auth/login.js";
      handleLoginForm();
    </script>
  </body>
</html>
