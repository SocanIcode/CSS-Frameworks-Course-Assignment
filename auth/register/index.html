<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Create your free Ingera Diary account and start expressing your thoughts, sharing memories, and following inspiring users."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="../../src/css/style.css" />
    <link rel="stylesheet" href="../../src\css\style.css" />
  </head>
  <body class="min-h-screen bg-slate-50 font-sans">
    <header class="bg-slate-800 p-4 sticky top-0 z-50">
      <nav
        class="relative flex justify-center items-center text-white text-xl font-semibold py-4"
      >
        <!-- Center Nav -->
        <div
          id="nav-center"
          class="absolute left-1/2 transform -translate-x-1/2 flex space-x-6"
        >
          <a href="/index.html" class="hover:underline">Home</a>
          <a href="/index.html" class="hover:underline">Explore</a>
        </div>

        <!-- Right Nav -->
        <div id="nav-right" class="flex items-center gap-2 ml-auto">
          <form id="navSearchForm" class="hidden md:block">
            <input
              id="navSearchInput"
              class="placeholder:text-gray-200 placeholder:italic border rounded-md text-black"
              placeholder="Search"
              type="text"
              name="search"
            />
          </form>
          <a href="/profile/index.html" class="hover:underline">Profile</a>
          <a href="/auth/login/index.html" class="hover:underline">Logout</a>
        </div>

        <!-- Optional: Logo -->
        <div
          id="logo"
          class="absolute left-4 text-2xl font-bold cursor-pointer text-yellow-400"
        ></div>
      </nav>

      <!-- Heading -->
      <h1 class="text-3xl font-bold text-white mt-4">New Post Feed</h1>
    </header>
    <main>
      <div class="flex items-center justify-center min-h-screen pt-16">
        <div
          class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg border-2 border-gray-200"
        >
          <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            Register
          </h1>
          <form id="loginForm" class="space-y-5">
            <div>
              <label for="name" class="block text-sm font-medium text-gray-700"
                >Name<span class="text-red-500">*</span></label
              >
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Username"
                required
                autocomplete="name"
                class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div>
              <label
                for="email"
                class="block text-sm font-medium text-gray-700"
              >
                Email <span class="text-red-500">*</span>
              </label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                required
                autocomplete="email"
                class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>

            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-700"
              >
                Password <span class="text-red-500">*</span>
              </label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
                autocomplete="new-password"
                minlength="8"
                class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div>
              <label for="bio" class="block text-sm font-medium text-gray-700"
                >Bio</label
              >
              <input
                id="bio"
                name="bio"
                autocomplete="off"
                class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div>
              <label
                for="avatar-url"
                class="block text-sm font-medium text-gray-700"
                >Avatar URL</label
              >
              <input
                id="avatar-url"
                name="avatar-url"
                autocomplete="off"
                class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div>
              <label
                for="avatar-alt"
                class="block text-sm font-medium text-gray-700"
                >Avatar ALT</label
              >
              <input
                id="avatar-alt"
                name="avatar-alt"
                autocomplete="off"
                class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div>
              <label
                for="banner-url"
                class="block text-sm font-medium text-gray-700"
                >Banner URL</label
              >
              <input
                id="banner-url"
                name="banner-url"
                autocomplete="off"
                class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div>
              <label
                for="banner-alt"
                class="block text-sm font-medium text-gray-700"
                >Banner ALT</label
              >
              <input
                id="banner-alt"
                name="banner-alt"
                autocomplete="off"
                class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>

            <button type="submit" class="btn btn-primary">Register</button>

            <div class="text-center mt-4">
              <a
                href="/auth/login/"
                class="text-indigo-500 hover:underline text-sm"
              >
                login
              </a>
            </div>
          </form>
        </div>
      </div>
    </main>
    <footer class="bg-slate-900 w-full p-10">
      <div id="nav"></div>
      <p class="text-md font-bold text-center text-white">
        @copyright Azeb 2025
      </p>
    </footer>
    <script type="module">
      import { handleLoginForm } from "/src/js/ui/auth/login.js";
      handleLoginForm();
    </script>
  </body>
</html>
